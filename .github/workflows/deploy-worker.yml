name: Deploy worker

# Deploys apps/worker (Worker, Workflows, Queue consumers) and the apps/diff-container image to
# Cloudflare. Runtime secrets come from GitHub secrets and are uploaded with the new version.

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/diff-container/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Ensure queues exist
        working-directory: apps/worker
        run: |
          existing="$(pnpm exec wrangler queues list)"
          for queue in vrt-capture vrt-capture-dlq vrt-diff vrt-diff-dlq; do
            if ! grep -qw -- "$queue" <<<"$existing"; then
              pnpm exec wrangler queues create "$queue"
            fi
          done

      - name: Write secrets file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          DIFF_CONTAINER_SHARED_SECRET: ${{ secrets.DIFF_CONTAINER_SHARED_SECRET }}
        run: |
          node -e '
            const keys = ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "CF_ACCOUNT_ID", "CF_API_TOKEN",
              "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "WORKER_SHARED_SECRET", "SETTINGS_ENCRYPTION_KEY",
              "RESEND_API_KEY", "EMAIL_FROM", "APP_URL", "DIFF_CONTAINER_SHARED_SECRET"];
            const missing = keys.filter((k) => !process.env[k]);
            if (missing.length) { console.error("Missing GitHub secrets: " + missing.join(", ")); process.exit(1); }
            const out = Object.fromEntries(keys.map((k) => [k, process.env[k]]));
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(out), { mode: 0o600 });
          '

      # Builds apps/diff-container/Dockerfile, pushes it to the Cloudflare registry and rolls out
      # the container together with the Worker version.
      - name: Deploy worker and diff container
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
